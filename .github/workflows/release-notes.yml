name: Оформление релиза

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Тег релиза, например v0.4.0
        required: true

permissions:
  contents: write

jobs:
  describe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверить файлы и дописать описание
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets.
          setup=$(find assets -name '*-setup.exe' | head -1)
          msi=$(find assets -name '*.msi' | head -1)
          zip=$(find assets -name '*.zip' | head -1)
          [ -n "$setup" ] || { echo "::error::В релизе нет -setup.exe"; exit 1; }
          [ -n "$zip" ]   || { echo "::error::В релизе нет .zip"; exit 1; }
          ver="${TAG#v}"
          for f in $setup $zip $msi; do
            [ -n "$f" ] || continue
            case "$(basename "$f")" in
              *"$ver"*) ;;
              *) echo "::error::$(basename "$f") собран не из версии $ver"; exit 1 ;;
            esac
          done

          gh release view "$TAG" --json body --jq .body > body.md
          if grep -q '^### Файлы$' body.md; then
            echo "Описание уже дополнено — пропускаю"
            exit 0
          fi

          {
            cat body.md
            echo
            echo '### Файлы'
            echo
            echo '| Файл | Размер | SHA256 |'
            echo '|---|---:|---|'
            for f in $setup $zip $msi; do
              [ -n "$f" ] || continue
              printf '| `%s` | %s | `%s` |\n' \
                "$(basename "$f")" \
                "$(numfmt --to=iec --suffix=B --format='%.1f' "$(stat -c%s "$f")")" \
                "$(sha256sum "$f" | cut -d' ' -f1)"
            done
          } > notes.md

          gh release edit "$TAG" --notes-file notes.md
